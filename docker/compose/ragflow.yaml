services:
  ragflow-mysql:
    profiles: ["ragflow"]
    container_name: ragflow-mysql
    image: ${RAGFLOW_MYSQL_IMAGE:-docker.m.daocloud.io/library/mysql:8.0.39}
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${RAGFLOW_MYSQL_PASSWORD:-change-me-ragflow-mysql-local-only}
      MYSQL_DATABASE: ${RAGFLOW_MYSQL_DATABASE:-rag_flow}
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - ./volumes/ragflow/mysql:/var/lib/mysql
    networks:
      - devopsnetwork

  ragflow-redis:
    profiles: ["ragflow"]
    container_name: ragflow-redis
    image: ${RAGFLOW_REDIS_IMAGE:-docker.m.daocloud.io/library/redis:7-alpine}
    restart: always
    command: redis-server --requirepass ${RAGFLOW_REDIS_PASSWORD:-change-me-ragflow-redis-local-only}
    environment:
      REDIS_PASSWORD: ${RAGFLOW_REDIS_PASSWORD:-change-me-ragflow-redis-local-only}
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - ./volumes/ragflow/redis:/data
    networks:
      - devopsnetwork

  ragflow-minio:
    profiles: ["ragflow"]
    container_name: ragflow-minio
    image: ${RAGFLOW_MINIO_IMAGE:-docker.m.daocloud.io/minio/minio:RELEASE.2025-04-22T22-12-26Z}
    restart: always
    environment:
      MINIO_ROOT_USER: ${RAGFLOW_MINIO_USER:-ragflow-local}
      MINIO_ROOT_PASSWORD: ${RAGFLOW_MINIO_PASSWORD:-change-me-ragflow-minio-local-only}
      MINIO_USER: ${RAGFLOW_MINIO_USER:-ragflow-local}
      MINIO_PASSWORD: ${RAGFLOW_MINIO_PASSWORD:-change-me-ragflow-minio-local-only}
    command: minio server /data --console-address ":9001"
    healthcheck:
      test:
        - CMD-SHELL
        - mc ready local
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - ./volumes/ragflow/minio:/data
    networks:
      - devopsnetwork

  ragflow-es:
    profiles: ["ragflow"]
    container_name: ragflow-es
    image: ${RAGFLOW_ELASTICSEARCH_IMAGE:-elastic.m.daocloud.io/elasticsearch/elasticsearch:8.11.3}
    restart: always
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${RAGFLOW_ES_JAVA_OPTS:--Xms1g -Xmx1g}
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    volumes:
      - ./volumes/ragflow/es:/usr/share/elasticsearch/data
    depends_on:
      ragflow-es-init:
        condition: service_completed_successfully
    networks:
      - devopsnetwork

  ragflow-es-init:
    profiles: ["ragflow"]
    image: ${RAGFLOW_ES_INIT_IMAGE:-docker.m.daocloud.io/library/alpine:3.20}
    volumes:
      - ./volumes/ragflow/es:/mnt/es-data
    entrypoint: ["sh", "-c", "chown -R 1000:0 /mnt/es-data"]
    networks: []

  ragflow:
    profiles: ["ragflow"]
    container_name: ragflow
    image: ${RAGFLOW_IMAGE:-docker.m.daocloud.io/infiniflow/ragflow:v0.26.1}
    restart: always
    command:
      - --enable-adminserver
      - --init-model-provider-tables
    depends_on:
      ragflow-mysql:
        condition: service_healthy
      ragflow-redis:
        condition: service_healthy
      ragflow-minio:
        condition: service_healthy
      ragflow-es:
        condition: service_healthy
    environment:
      DOC_ENGINE: elasticsearch
      DEVICE: cpu
      API_PROXY_SCHEME: python
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_HOST: ragflow-mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${RAGFLOW_MYSQL_PASSWORD:-change-me-ragflow-mysql-local-only}
      MYSQL_DBNAME: ${RAGFLOW_MYSQL_DATABASE:-rag_flow}
      REDIS_HOST: ragflow-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${RAGFLOW_REDIS_PASSWORD:-change-me-ragflow-redis-local-only}
      MINIO_HOST: ragflow-minio
      MINIO_USER: ${RAGFLOW_MINIO_USER:-ragflow-local}
      MINIO_PASSWORD: ${RAGFLOW_MINIO_PASSWORD:-change-me-ragflow-minio-local-only}
      ES_HOST: ragflow-es
      ES_PORT: 9200
      ELASTIC_PASSWORD: ${RAGFLOW_ELASTIC_PASSWORD:-change-me-ragflow-elastic-local-only}
      SVR_WEB_HTTP_PORT: 80
      SVR_WEB_HTTPS_PORT: 443
      SVR_HTTP_PORT: 9380
      ADMIN_SVR_HTTP_PORT: 9381
      SVR_MCP_PORT: 9382
      GO_HTTP_PORT: 9384
      GO_ADMIN_PORT: 9383
    ports:
      - "127.0.0.1:${RAGFLOW_WEB_PORT:-8088}:80"
      - "127.0.0.1:${RAGFLOW_API_PORT:-9380}:9380"
    volumes:
      - ./volumes/ragflow/logs:/ragflow/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - devopsnetwork
