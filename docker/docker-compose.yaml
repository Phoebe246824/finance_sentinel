include:
  - compose/dependencies.yaml

services:
  sentinel-api:
    container_name: sentinel-api
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      args:
        PYTHON_BASE_IMAGE: ${SENTINEL_PYTHON_BASE_IMAGE:-docker.m.daocloud.io/library/python:3.13-slim-bookworm}
        UV_DEFAULT_INDEX: ${UV_DEFAULT_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}
        UV_VERSION: ${UV_VERSION:-0.11.16}
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      NEO4J_URI: bolt://neo4j:7687
      MILVUS_URI: http://milvus:19530
      RAGFLOW_BASE_URL: ${RAGFLOW_BASE_URL:-http://ragflow:9380}
    volumes:
      - ../config:/app/config
    depends_on:
      neo4j:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/openapi.json', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - devopsnetwork

  sentinel-web:
    container_name: sentinel-web
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        NODE_BASE_IMAGE: ${SENTINEL_NODE_BASE_IMAGE:-docker.m.daocloud.io/library/node:20.19-bookworm-slim}
        NGINX_BASE_IMAGE: ${SENTINEL_NGINX_BASE_IMAGE:-docker.m.daocloud.io/library/nginx:1.27-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    restart: unless-stopped
    ports:
      - "${SENTINEL_WEB_PORT:-8080}:80"
    depends_on:
      sentinel-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - devopsnetwork
