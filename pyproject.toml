[project]
name = "finance-sentinel"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "crewai>=1.14.5",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "litellm>=1.90.0",
    "neo4j>=6.2.0",
    "numpy>=2.4.6",
    "openai>=2.38.0",
    "posthog>=5.4.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.10.1",
    "pymilvus>=3.0.0",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.2",
    "tenacity>=9.1.4",
    "typing-extensions>=4.15.0",
    "ulid-py>=1.1.0",
    "uvicorn>=0.48.0",
    "rich>=14.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
sentinel = "sentinel.main:run_cli"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "integration: tests requiring live Milvus/Neo4j/LLM services (deselect with '-m \"not integration\"')",
]

[tool.ruff]
extend-exclude = ["src/graphiti_core"]

[tool.ruff.lint]
extend-select = ["I", "D100"]

[tool.ruff.lint.per-file-ignores]
# 测试文件不强制模块 docstring；生产代码（src/ 与 scripts/）由 D100 守护。
"tests/**" = ["D100"]

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel", "src/graphiti_core"]
artifacts = ["src/graphiti_core/py.typed"]
